[package]
name = "rustycogs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ['staticlib']
name = 'rustycogs'

[dependencies]
extendr-api = '0.7'
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-tiff = { version = "0.3" }
object_store = { version = "0.13", features = ["aws", "gcp", "azure", "http"] }
# async-tiff's reqwest dependency has default-features = false (no TLS backend);
# enabling rustls here gives it TLS via Cargo feature unification.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
futures = "0.3"
url = "2"
