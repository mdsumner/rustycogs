[package]
name = "rustycogs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ['staticlib']
name = 'rustycogs'

[dependencies]
extendr-api = '0.7'
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-tiff = { version = "0.2", features = ["object_store"] }
object_store = { version = "0.13", features = ["aws", "gcp", "azure", "http"] }
futures = "0.3"
url = "2"
